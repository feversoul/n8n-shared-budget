# n8n with the workflows already imported, a PostgreSQL for the Postgres
# ledger and a small stand-in for the model API, to try it locally.
#   cp .env.example .env   (fill it in)   then   docker compose up -d
# Already have n8n (Cloud or your own)? You do not need this file: see
# "Add it to your n8n" in the README.

services:
  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.47.7}
    restart: unless-stopped
    entrypoint: ["sh", "/bootstrap/bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # The secret a caller puts in the X-Budget-Key header.
      WEBHOOK_KEY: ${WEBHOOK_KEY:?set WEBHOOK_KEY in .env}
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD:?set BUDGET_DB_PASSWORD in .env}
      MODEL_API_KEY: ${MODEL_API_KEY:-local-stand-in}
      # Where "Call the model" posts. Any OpenAI-compatible chat completions address.
      MODEL_URL: ${MODEL_URL:-http://model:8080/v1/chat/completions}
      # Optional, mostly for the tests: shorter waits, time-outs and sweeps.
      WAIT_SECONDS: ${WAIT_SECONDS:-}
      MAX_WAITS: ${MAX_WAITS:-}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-}
      CALL_TIMEOUT_SECONDS: ${CALL_TIMEOUT_SECONDS:-}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/bootstrap/workflows:ro
      - ./docker/bootstrap.sh:/bootstrap/bootstrap.sh:ro
      - ./docker/prepare.mjs:/bootstrap/prepare.mjs:ro
    ports:
      - "${N8N_PORT:-5678}:5678"

  # Holds ai_budget and ai_reservations for the Postgres ledger. n8n itself
  # stays on SQLite.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${BUDGET_DB_PASSWORD:?set BUDGET_DB_PASSWORD in .env}
      POSTGRES_DB: budget
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - budget_data:/var/lib/postgresql/data

  # Stand-in for the model API: POST /v1/chat/completions in the OpenAI shape,
  # with a usage block. It counts every request and token it serves:
  # GET /stats?match=<text in the prompt>
  model:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/model.mjs"]
    volumes:
      - ./docker/model.mjs:/app/model.mjs:ro
    ports:
      - "${MODEL_PORT:-8080}:8080"

volumes:
  n8n_data:
  budget_data:
